name: quality
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-and-research-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt -r requirements-docs.txt
      - run: python3 -m pytest -q
      - run: python3 tools/traceability_check.py
      - run: python3 tools/generate_io_reference.py --check
      - run: python3 tools/quality_gate.py
      - run: python3 tools/deep_review.py
      - run: python3 tools/research_gate.py
      - run: python3 tools/pedagogy_gate.py
      - run: python3 tools/release_gate.py
      - run: python3 tools/learning_path.py check
      - run: node --check docs/assets/learning-journey.js
      - run: node --test tests/learning_journey.test.cjs
      - run: node --check portal/static/guided-start.js
      - run: node --test tests/guided_start.test.cjs
      - run: node --check portal/static/dashboard.js
      - run: node --test tests/dashboard.test.cjs
      - run: bash -n labctl deploy/preflight.sh deploy/check-secrets.sh deploy/backup.sh deploy/restore.sh deploy/install-systemd.sh
      - run: mkdocs build --strict
  course-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build and start the isolated static course
        run: docker compose --env-file /dev/null -p lng-course-ci -f compose.docs.yml up -d --build --wait --wait-timeout 90
      - name: Verify course routes and private-runtime boundary
        run: |
          curl --fail --silent http://127.0.0.1:8088/healthz
          curl --fail --silent --output /dev/null http://127.0.0.1:8088/00-learning/learning-journey/
          curl --fail --silent --output /dev/null http://127.0.0.1:8088/00-learning/investigation-capstone/
          curl --fail --silent --output /dev/null http://127.0.0.1:8088/assets/learning-journey.json
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8088/api/state)" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8088/.env)" != 200
          test "$(docker compose --env-file /dev/null -p lng-course-ci -f compose.docs.yml exec -T course id -u)" = 101
      - name: Course logs on failure
        if: failure()
        run: docker compose --env-file /dev/null -p lng-course-ci -f compose.docs.yml logs --no-color
      - name: Stop only the isolated course project
        if: always()
        run: docker compose --env-file /dev/null -p lng-course-ci -f compose.docs.yml down
  learning-portal-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build and start the read-only learning portal
        run: |
          docker build --tag lng-learning-portal-ci portal
          docker run --detach --name lng-learning-portal-ci --publish 127.0.0.1:8501:8500 lng-learning-portal-ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs lng-learning-portal-ci
          exit 1
      - name: Verify guide assets, health scope and non-root runtime
        run: |
          curl --fail --silent http://127.0.0.1:8501/ | grep --fixed-strings 'data-tab="learn" class="active">Guided start'
          curl --fail --silent http://127.0.0.1:8501/static/first-session.json | python3 -c 'import json,sys; data=json.load(sys.stdin); assert len(data["steps"]) == 7'
          curl --fail --silent --output /dev/null http://127.0.0.1:8501/static/guided-start.js
          curl --fail --silent --output /dev/null http://127.0.0.1:8501/static/dashboard.js
          curl --fail --silent --output /dev/null http://127.0.0.1:8501/static/diagrams/first-session.svg
          curl --fail --silent http://127.0.0.1:8501/health | python3 -c 'import json,sys; assert json.load(sys.stdin)["scope"] == "portal-content-only"'
          curl --fail --silent --max-time 3 http://127.0.0.1:8501/api/snapshot | python3 -c 'import json,sys; data=json.load(sys.stdin); assert set(data) == {"cargo","pms","propulsion","vessel","alarms","catalog","history","alarm_metrics"}; assert all(v == {"ready": False, "error": "upstream unavailable"} for v in data.values())'
          test "$(docker exec lng-learning-portal-ci id -u)" = 10001
      - name: Portal logs on failure
        if: failure()
        run: docker logs lng-learning-portal-ci
      - name: Stop the isolated portal container
        if: always()
        run: docker rm --force lng-learning-portal-ci
