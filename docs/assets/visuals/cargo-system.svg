<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
<title id="title">Cargo transfer: liquid flow, electrical power and control</title>
<desc id="desc">An aggregate ship cargo tank feeds a pump and valve, then a shore receiving inventory. The power management model supplies pump power availability through the Vessel Coordinator. OpenPLC commands the pump and valve through Modbus I/O and receives separate feedback and flow measurements. This is a teaching schematic, not a vessel piping design or runtime screenshot.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#116d7a" stroke-width="1.5"/></marker><style>text{font-family:Arial,sans-serif;fill:#153440}.h{font-size:28px;font-weight:bold}.s{font-size:17px}.b{font-size:20px;font-weight:bold}.muted{fill:#4b6570}.pipe{fill:none;stroke:#116d7a;stroke-width:5;marker-end:url(#a)}.signal{fill:none;stroke:#365bc0;stroke-width:2.5;stroke-dasharray:7 5}.card{fill:#fff;stroke:#b9cdd2;stroke-width:1.5}</style></defs>
<rect width="1000" height="760" rx="16" fill="#f3f7f8"/>
<text x="34" y="47" class="h">Why can a running pump have no flow?</text>
<text x="34" y="79" class="s muted">Follow three things separately: liquid, electrical supply, and controller signals.</text>
<rect x="35" y="112" width="930" height="79" rx="10" fill="#e8eefc"/>
<text x="55" y="143" class="b">PMS electrical supply</text>
<text x="55" y="171" class="s">Bus availability → Vessel Coordinator → Cargo powerAvailable</text>
<path d="M403 191V258" class="signal"/>
<text x="421" y="230" class="s">Pump demand returns to PMS as kW</text>
<rect x="45" y="265" width="210" height="167" rx="10" class="card"/>
<path d="M47 340H253V420Q253 430 243 430H57Q47 430 47 420Z" fill="#c1e8ea"/>
<text x="64" y="294" class="b">Ship cargo inventory</text>
<text x="64" y="321" class="s">levelSource [m]</text>
<text x="64" y="395" class="s">Level falls in unloading</text>
<path d="M255 350H352" class="pipe"/>
<circle cx="400" cy="350" r="47" fill="#fff" stroke="#116d7a" stroke-width="3"/>
<path d="M379 326L432 350L379 374Z" fill="#c1e8ea" stroke="#116d7a" stroke-width="2"/>
<text x="400" y="427" text-anchor="middle" class="b">Pump bank</text>
<text x="400" y="454" text-anchor="middle" class="s">Speed ≠ flow</text>
<path d="M448 350H546" class="pipe"/>
<path d="M548 327L590 350L630 327V373L590 350L548 373Z" fill="#fff" stroke="#116d7a" stroke-width="3"/>
<text x="590" y="427" text-anchor="middle" class="b">Valve</text>
<text x="590" y="454" text-anchor="middle" class="s">Position + feedback</text>
<path d="M632 350H746" class="pipe"/>
<text x="650" y="316" class="s">Flow →</text>
<rect x="750" y="265" width="205" height="167" rx="10" class="card"/>
<path d="M752 387H953V420Q953 430 943 430H762Q752 430 752 420Z" fill="#c1e8ea"/>
<text x="768" y="294" class="b">Shore receiver</text>
<text x="768" y="321" class="s">levelDestination [m]</text>
<text x="768" y="365" class="s">Inventory proxy only</text>
<text x="768" y="398" class="s">Level rises</text>
<path d="M400 480V518M590 480V518" class="signal"/>
<rect x="35" y="518" width="930" height="108" rx="10" fill="#e8eefc"/>
<text x="55" y="549" class="b">OpenPLC ↔ Modbus TCP ↔ Cargo software I/O</text>
<text x="55" y="580" class="s">Command: pumpCmd / valveCommand     Feedback: pumpFeedback / valveFeedback</text>
<text x="55" y="607" class="s">Measurement: flowMeasured → input register 2 → AI_Flow_m3h → Flow_m3h</text>
<text x="35" y="665" class="b">Investigation question</text>
<text x="35" y="695" class="s">Is liquid blocked, electrical power unavailable, or the measurement misleading?</text>
<text x="35" y="731" class="s muted">Original teaching schematic • aggregate model • not a vessel P&amp;ID or runtime evidence</text>
</svg>
