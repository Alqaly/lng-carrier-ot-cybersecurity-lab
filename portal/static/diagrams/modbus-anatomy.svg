<rect x="600" y="420" width="220" height="90" rx="16" fill="#15342d" stroke="#7dc8f4" stroke-width="2"/>
<text x="710.0" y="457" fill="#fff" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">PLC Tag</text>
