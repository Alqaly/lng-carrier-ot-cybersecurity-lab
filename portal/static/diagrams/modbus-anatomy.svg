<text x="710.0" y="187" fill="#fff" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">TCP</text>
<text x="710.0" y="217" fill="#c4d4e2" text-anchor="middle" font-family="Arial" font-size="14">connection / sequencing</text>
