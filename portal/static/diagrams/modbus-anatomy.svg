<text x="980.0" y="187" fill="#fff" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">MBAP</text>
<text x="980.0" y="217" fill="#c4d4e2" text-anchor="middle" font-family="Arial" font-size="14">transaction / length / unit</text>
<rect x="1140" y="150" width="250" height="90" rx="16" fill="#30263d" stroke="#7dc8f4" stroke-width="2"/>
<text x="1265.0" y="187" fill="#fff" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">Modbus PDU</text>
<text x="1265.0" y="217" fill="#c4d4e2" text-anchor="middle" font-family="Arial" font-size="14">function + address + data</text>
