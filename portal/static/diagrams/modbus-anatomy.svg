<text x="980.0" y="457" fill="#fff" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">Process State</text>
<text x="980.0" y="487" fill="#c4d4e2" text-anchor="middle" font-family="Arial" font-size="14">level / flow / feedback</text>
