<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#83cfff"/></marker></defs>
<rect width="100%" height="100%" fill="#0b1117"/>
<text x="55" y="60" fill="white" font-family="Arial" font-size="34" font-weight="700">Modbus TCP — From Ethernet Frame to Process Meaning</text>
<rect x="60" y="150" width="220" height="90" rx="16" fill="#1d2c45" stroke="#7dc8f4" stroke-width="2"/>
<text x="170.0" y="187" fill="#fff" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">Ethernet</text>
<text x="170.0" y="217" fill="#c4d4e2" text-anchor="middle" font-family="Arial" font-size="14">L2 delivery</text>
<rect x="330" y="150" width="220" height="90" rx="16" fill="#1d2c45" stroke="#7dc8f4" stroke-width="2"/>
<text x="440.0" y="187" fill="#fff" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">IP</text>
<text x="440.0" y="217" fill="#c4d4e2" text-anchor="middle" font-family="Arial" font-size="14">source / destination</text>
