<rect width="100%" height="100%" fill="#0b1117"/>
<text x="55" y="60" fill="#fff" font-family="Arial" font-size="34" font-weight="700">Cargo Model — Aggregate Pump Bank Anchored to a Public LNG-Carrier Example</text>
