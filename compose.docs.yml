# Standalone file, not an overlay on the private OT lab.
services:
  course:
    image: lng-carrier-course:local
    build:
      context: .
      dockerfile: deploy/docs/Dockerfile
    ports:
      - "127.0.0.1:8088:8080"
    read_only: true
    user: "101:101"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
