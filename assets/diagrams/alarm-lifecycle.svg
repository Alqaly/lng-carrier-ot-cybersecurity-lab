<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6f8794"/></marker></defs>
<rect width="100%" height="100%" fill="#eef0f2"/>
<text x="55" y="60" fill="#252a2e" font-family="Arial" font-size="32" font-weight="700">Alarm Lifecycle Used in the Learning Chronicle</text>
<rect x="90" y="180" width="260" height="100" rx="10" fill="#fafbfc" stroke="#7d858c" stroke-width="2"/>
<text x="220.0" y="216" text-anchor="middle" fill="#252a2e" font-family="Arial" font-size="19" font-weight="700">NORMAL</text>
<text x="220.0" y="245" text-anchor="middle" fill="#626b72" font-family="Arial" font-size="13">condition false</text>
<rect x="450" y="180" width="260" height="100" rx="10" fill="#fafbfc" stroke="#7d858c" stroke-width="2"/>
<text x="580.0" y="216" text-anchor="middle" fill="#252a2e" font-family="Arial" font-size="19" font-weight="700">ACTIVE / UNACK</text>
<text x="580.0" y="245" text-anchor="middle" fill="#626b72" font-family="Arial" font-size="13">operator attention required</text>
<rect x="810" y="180" width="260" height="100" rx="10" fill="#fafbfc" stroke="#7d858c" stroke-width="2"/>
<text x="940.0" y="216" text-anchor="middle" fill="#252a2e" font-family="Arial" font-size="19" font-weight="700">ACTIVE / ACK</text>
<text x="940.0" y="245" text-anchor="middle" fill="#626b72" font-family="Arial" font-size="13">condition still present</text>
<rect x="1170" y="180" width="260" height="100" rx="10" fill="#fafbfc" stroke="#7d858c" stroke-width="2"/>
<text x="1300.0" y="216" text-anchor="middle" fill="#252a2e" font-family="Arial" font-size="19" font-weight="700">RETURNED</text>
<text x="1300.0" y="245" text-anchor="middle" fill="#626b72" font-family="Arial" font-size="13">condition cleared</text>
<line x1="350" y1="230" x2="450" y2="230" stroke="#6f8794" stroke-width="3" marker-end="url(#a)"/>
<text x="400.0" y="223.0" text-anchor="middle" fill="#7a5a00" font-family="Arial" font-size="13">condition true</text>
<line x1="710" y1="230" x2="810" y2="230" stroke="#6f8794" stroke-width="3" marker-end="url(#a)"/>
<text x="760.0" y="223.0" text-anchor="middle" fill="#7a5a00" font-family="Arial" font-size="13">ack</text>
<line x1="1070" y1="230" x2="1170" y2="230" stroke="#6f8794" stroke-width="3" marker-end="url(#a)"/>
<text x="1120.0" y="223.0" text-anchor="middle" fill="#7a5a00" font-family="Arial" font-size="13">condition clears</text>
<line x1="1300" y1="280" x2="220" y2="500" stroke="#6f8794" stroke-width="3" marker-end="url(#a)"/>
<text x="760.0" y="383.0" text-anchor="middle" fill="#7a5a00" font-family="Arial" font-size="13">new cycle</text>
<text x="55" y="820" fill="#6b7379" font-family="Arial" font-size="13">Events record transitions; a trip is a protective control action, not an alarm state.</text>
</svg>