[agent]
  interval = "1s"
  flush_interval = "1s"

# OPC UA input stanzas are installed only after live discovery and a clean
# binding-plan gate. See ./labctl opcua, ./labctl bind-plan, ./labctl hist-install.

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
